<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KUBIX GEAR | Oficiální technická výbava a setup</title>
  <style>
    :root {
      --bg: #07080c;
      --surface: #0e1017;
      --surface-2: #141722;
      --border: #1e2333;
      --border-subtle: #161a26;
      --text: #f3f4f8;
      --muted: #8b92a8;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --accent-text: #ffffff;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --accent-border: rgba(37, 99, 235, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 28px 20px 72px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    /* Horní lišta */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 900;
      font-size: 20px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.35);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .badge {
      background: var(--accent-soft);
      color: #60a5fa;
      border: 1px solid var(--accent-border);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.6px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    .social-btn:hover {
      border-color: var(--accent);
      background: var(--surface-2);
      transform: translateY(-1px);
    }

    /* Hero sekce */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 36px 0 30px;
      gap: 24px;
      flex-wrap: wrap;
    }

      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-soft

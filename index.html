<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KUBIX GEAR | Oficiální technická výbava a setup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-box">K</div>
        <div>
          <div class="brand-title">KUBIX <span class="badge">GEAR</span></div>
          <div class="brand-sub">Oficiální technická výbava a studiový hardware</div>
        </div>
      </div>
      <div class="socials">
        <a class="social-btn" href="https://www.youtube.com/@kubix.6666" target="_blank" rel="noopener">YouTube</a>
        <a class="social-btn" href="https://discord.gg/ca9gsatecu" target="_blank" rel="noopener">Discord</a>
      </div>
    </header>

    <section class="hero">
      <div>
        <div class="hero-tag">● STUDIÓVÉ &amp; PRODUKČNÍ VYBAVENÍ</div>
        <h1>Hardware &amp; Setup <span>Kubix</span></h1>
        <p class="hero-desc">Přehled techniky a výbavy, kterou používám na natáčení videí, střih, VR hraní a streamování.</p>
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-num" id="total-products">0</div>
          <div class="stat-label">PRODUKTŮ</div>
        </div>
        <div class="stat-card">
          <div class="stat-num accent" id="total-categories">0</div>
          <div class="stat-label">KATEGORIÍ</div>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="search-row">
        <input type="text" id="search" class="search-input" placeholder="Hledat podle názvu..." />
        <div class="count-info">Zobrazeno: <strong id="shown-count">0</strong> / <span id="all-count">0</span></div>
      </div>
      <div class="filters" id="filters"></div>
    </section>

    <main class="grid" id="grid"></main>
  </div>

  <script>
    const GEAR = [
      { name: "HP Victus 15", note: "Notebook na střih a hraní", category: "PC & Workstation", icon: "💻" },
      { name: "Meta Oculus Quest 2", note: "VR headset", category: "Konzole & VR", icon: "🥽" },
      { name: "Canon EOS 600D", note: "DSLR kamera", category: "Kamery & Studio", icon: "📷" },
      { name: "Fifine A6V + Rameno", note: "Mikrofon na rameni", category: "Audio & Streaming", icon: "🎙️" },
      { name: "Apple iPhone 13", note: "Mobilní kamera a střih", category: "Telefony & Příslušenství", icon: "📱" }
    ];

    let activeCategory = "Vše";
    let searchQuery = "";

    const gridEl = document.getElementById("grid");
    const filtersEl = document.getElementById("filters");
    const searchEl = document.getElementById("search");

    function init() {
      const categories = ["Vše", ...new Set(GEAR.map(i => i.category))];
      document.getElementById("total-products").textContent = GEAR.length;
      document.getElementById("total-categories").textContent = categories.length - 1;
      document.getElementById("all-count").textContent = GEAR.length;

      filtersEl.innerHTML = categories.map(cat => {
        const count = cat === "Vše" ? GEAR.length : GEAR.filter(i => i.category === cat).length;
        return `<button class="filter-btn ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">${cat} <span class="pill">${count}</span></button>`;
      }).join("");

      filtersEl.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          render();
        });
      });

      searchEl.addEventListener("input", e => {
        searchQuery = e.target.value.toLowerCase().trim();
        render();
      });

      render();
    }

    function render() {
      const items = GEAR
        .map((item, idx) => ({ ...item, id: String(idx + 1).padStart(2, "0") }))
        .filter(item => {
          const matchCat = activeCategory === "Vše" || item.category === activeCategory;
          const matchSearch = !searchQuery || item.name.toLowerCase().includes(searchQuery) || (item.note && item.note.toLowerCase().includes(searchQuery));
          return matchCat && matchSearch;
        });

      document.getElementById("shown-count").textContent = items.length;
      if (!items.length) {
        gridEl.innerHTML = `<div class="empty-state">Žádný produkt neodpovídá zadanému hledání.</div>`;
        return;
      }

      gridEl.innerHTML = items.map(item => `
        <article class="card">
          <div class="preview-box">${item.icon}</div>
          <div class="card-meta">
            <span class="cat-tag">${item.category}</span>
            <span class="item-num">#${item.id}</span>
          </div>
          <h2 class="card-title">${item.name}</h2>
          ${item.note ? `<p class="card-note">${item.note}</p>` : ""}
        </article>
      `).join("");
    }

    init();
  </script>
</body>
</html>

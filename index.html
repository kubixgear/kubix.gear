<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KUBIX GEAR | Oficiální technická výbava a studiový hardware</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .hero-price {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(37, 99, 235, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #e2e8f0;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .hero-price span {
      color: #60a5fa;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-box">K</div>
        <div>
          <div class="brand-title">KUBIX <span class="badge">GEAR</span></div>
          <div class="brand-sub">Oficiální technická výbava a studiový hardware</div>
        </div>
      </div>
      <div class="socials">
        <a class="social-btn" href="https://www.youtube.com/@kubix.6666" target="_blank" rel="noopener">YouTube</a>
        <a class="social-btn" href="https://discord.gg/ca9gsatecu" target="_blank" rel="noopener">Discord</a>
      </div>
    </header>

    <section class="hero">
      <div>
        <div class="hero-tag">● STUDIÓVÉ &amp; PRODUKČNÍ VYBAVENÍ</div>
        <h1>Hardware &amp; Setup <span>Kubix</span></h1>
        <p class="hero-desc">Kompletní přehled přesné výbavy používané pro tvorbu obsahu, střih videí, VR hraní a streamování.</p>
        <div class="hero-price">Celková Cena <span>cca 89 790 Kč</span></div>
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-num" id="total-products">0</div>
          <div class="stat-label">PRODUKTŮ</div>
        </div>
        <div class="stat-card">
          <div class="stat-num accent" id="total-categories">0</div>
          <div class="stat-label">KATEGORIÍ</div>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="search-row">
        <input type="text" id="search" class="search-input" placeholder="Hledat podle názvu..." />
        <div class="count-info">Zobrazeno: <strong id="shown-count">0</strong> / <span id="all-count">0</span></div>
      </div>
      <div class="filters" id="filters"></div>
    </section>

    <main class="grid" id="grid"></main>
  </div>

  <script>
    const GEAR = [
      { name: "MSI Mini Cubi PC", category: "PC & Workstation", icon: "🖥️" },
      { name: "Edersonic Hi-System", category: "Audio & Streaming", icon: "🔊" },
      { name: "Sencor SEP 540 BT", category: "Audio & Streaming", icon: "🎧" },
      { name: "Apple Watch Series 4", category: "Wearables & Příslušenství", icon: "⌚" },
      { name: "Action Line 263-O", category: "Kamery & Studio", icon: "📐" },
      { name: "Huawei Nova 5T", category: "Telefony & Příslušenství", icon: "📱" },
      { name: "Lamax Muse2", category: "Audio & Streaming", icon: "🎧" },
      { name: "FIXED Zen 2 Powerbanka", category: "Telefony & Příslušenství", icon: "🔋" },
      { name: "Lamax X9.2", category: "Kamery & Studio", icon: "📹" },
      { name: "AUKEY PC-LM1E", category: "Kamery & Studio", icon: "📷" },
      { name: "Apple MagSafe Charger", category: "Telefony & Příslušenství", icon: "⚡" },
      { name: "Marvo Scorpion KM400", category: "Periferie & Setup", icon: "⌨️" },
      { name: "Wired Optical Mouse WM-01", category: "Periferie & Setup", icon: "🖱️" },
      { name: "WD My Passport Ultra 3TB WDBFKT0030BGY", category: "PC & Workstation", icon: "💾" },
      { name: "Meta Quest 2", category: "Konzole & VR", icon: "🥽" },
      { name: "Canon EOS 600D", category: "Kamery & Studio", icon: "📷" },
      { name: "Fifine A6V", category: "Audio & Streaming", icon: "🎙️" },
      { name: "Apple iPhone 13", category: "Telefony & Příslušenství", icon: "📱" }
    ];

    let activeCategory = "Vše";
    let searchQuery = "";

    const gridEl = document.getElementById("grid");
    const filtersEl = document.getElementById("filters");
    const searchEl = document.getElementById("search");

    function init() {
      const categories = ["Vše", ...new Set(GEAR.map(i => i.category))];
      document.getElementById("total-products").textContent = GEAR.length;
      document.getElementById("total-categories").textContent = Math.max(0, categories.length - 1);
      document.getElementById("all-count").textContent = GEAR.length;

      filtersEl.innerHTML = categories.map(cat => {
        const count = cat === "Vše" ? GEAR.length : GEAR.filter(i => i.category === cat).length;
        return `<button class="filter-btn ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">${cat} <span class="pill">${count}</span></button>`;
      }).join("");

      filtersEl.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          render();
        });
      });

      searchEl.addEventListener("input", e => {
        searchQuery = e.target.value.toLowerCase().trim();
        render();
      });

      render();
    }

    function render() {
      const items = GEAR
        .map((item, idx) => ({ ...item, id: String(idx + 1).padStart(2, "0") }))
        .filter(item => {
          const matchCat = activeCategory === "Vše" || item.category === activeCategory;
          const matchSearch = !searchQuery || item.name.toLowerCase().includes(searchQuery) || item.category.toLowerCase().includes(searchQuery);
          return matchCat && matchSearch;
        });

      document.getElementById("shown-count").textContent = items.length;
      if (!items.length) {
        gridEl.innerHTML = `<div class="empty-state">Žádný produkt neodpovídá zadanému hledání.</div>`;
        return;
      }

      gridEl.innerHTML = items.map(item => `
        <article class="card">
          <div class="preview-box">${item.icon || "📦"}</div>
          <div class="card-meta">
            <span class="cat-tag">${item.category}</span>
            <span class="item-num">#${item.id}</span>
          </div>
          <h2 class="card-title">${item.name}</h2>
        </article>
      `).join("");
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KUBIX GEAR | Oficiální technická výbava a setup</title>
  <style>
    :root {
      --bg: #07080c;
      --surface: #0e1017;
      --surface-2: #141722;
      --border: #1e2333;
      --border-subtle: #161a26;
      --text: #f3f4f8;
      --muted: #8b92a8;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --accent-text: #ffffff;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --accent-border: rgba(37, 99, 235, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 28px 20px 72px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    /* Horní lišta */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 900;
      font-size: 20px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.35);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .badge {
      background: var(--accent-soft);
      color: #60a5fa;
      border: 1px solid var(--accent-border);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.6px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    .social-btn:hover {
      border-color: var(--accent);
      background: var(--surface-2);
      transform: translateY(-1px);
    }

    /* Hero sekce */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 36px 0 30px;
      gap: 24px;
      flex-wrap: wrap;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-soft);
      color: #60a5fa;
      border: 1px solid var(--accent-border);
      font-size: 10.5px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      margin-bottom: 14px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 4.5vw, 48px);
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }

    h1 span {
      color: var(--accent-hover);
    }

    .hero-desc {
      color: var(--muted);
      max-width: 620px;
      margin-top: 12px;
      font-size: 14.5px;
    }

    .stats {
      display: flex;
      gap: 12px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      min-width: 112px;
    }

    .stat-num {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.15;
    }

    .stat-num.accent {
      color: var(--accent-hover);
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.9px;
      margin-top: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Filtry a vyhledávání */
    .controls {
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }

    .search-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 15px;
      border-radius: 9px;
      width: 100%;
      max-width: 340px;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input::placeholder {
      color: #5a6178;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .count-info {
      font-size: 12.5px;
      color: var(--muted);
    }

    .count-info strong {
      color: var(--text);
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.18s ease;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: #2f3752;
    }

    .filter-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 700;
    }

    .filter-btn .pill {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    .filter-btn.active .pill {
      background: rgba(0, 0, 0, 0.25);
      color: var(--accent-text);
    }

    /* Mřížka karet */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #2e3754;
    }

    .preview-box {
      height: 126px;
      border-radius: 10px;
      border: 1px dashed #22283b;
      background-color: #0b0d13;
      background-image: radial-gradient(rgba(96, 165, 250, 0.09) 1px, transparent 1px);
      background-size: 14px 14px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      font-size: 32px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .cat-tag {
      background: var(--accent-soft);
      color: #60a5fa;
      border: 1px solid var(--accent-border);
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-num {
      font-size: 11.5px;
      color: #5b627a;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .card-note {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-box">K</div>
        <div>
          <div class="brand-title">KUBIX <span class="badge">GEAR</span></div>
          <div class="brand-sub">Oficiální technická výbava a studiový hardware</div>
        </div>
      </div>

      <div class="socials">
        <a class="social-btn" href="https://www.youtube.com/@kubix.6666" target="_blank" rel="noopener">YouTube</a>
        <a class="social-btn" href="https://discord.gg/ca9gsatecu" target="_blank" rel="noopener">Discord</a>
      </div>
    </header>

    <section class="hero">
      <div>
        <div class="hero-tag">● STUDIÓVÉ &amp; PRODUKČNÍ VYBAVENÍ</div>
        <h1>Hardware &amp; Setup <span>Kubix</span></h1>
        <p class="hero-desc">
          Přehled techniky a výbavy, kterou používám na natáčení videí, střih, VR hraní a streamování.
        </p>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-num" id="total-products">0</div>
          <div class="stat-label">PRODUKTŮ</div>
        </div>
        <div class="stat-card">
          <div class="stat-num accent" id="total-categories">0</div>
          <div class="stat-label">KATEGORIÍ</div>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="search-row">
        <input type="text" id="search" class="search-input" placeholder="Hledat podle názvu..." />
        <div class="count-info">Zobrazeno: <strong id="shown-count">0</strong> / <span id="all-count">0</span></div>
      </div>
      <div class="filters" id="filters"></div>
    </section>

    <main class="grid" id="grid"></main>
  </div>

  <script>
    // =========================================================================
    // SEM SI DOPLŇ SVOJI TECHNIKU (stačí přepsat název, kategorii, popis a ikonu)
    // =========================================================================
    const GEAR = [
      {
        name: "HP Victus 15",
        note: "Hlavní notebook na střih a hraní",
        category: "PC & Workstation",
        icon: "💻"
      },
      {
        name: "Meta Oculus Quest 2",
        note: "VR headset",
        category: "Konzole & VR",
        icon: "🥽"
      },
      {
        name: "Canon EOS 600D",
        note: "Zrcadlovka na natáčení a webkameru",
        category: "Kamery & Studio",
        icon: "📷"
      },
      {
        name: "Fifine A6V + Rameno",
        note: "Studiový mikrofon na rameni",
        category: "Audio & Streaming",
        icon: "🎙️"
      },
      {
        name: "Apple iPhone 13",
        note: "Mobilní kamera a střih",
        category: "Telefony & Příslušenství",
        icon: "📱"
      }
    ];

    let activeCategory = "Vše";
    let searchQuery = "";

    const gridEl = document.getElementById("grid");
    const filtersEl = document.getElementById("filters");
    const searchEl = document.getElementById("search");

    function init() {
      const categories = ["Vše", ...new Set(GEAR.map(item => item.category))];
      document.getElementById("total-products").textContent = GEAR.length;
      document.getElementById("total-categories").textContent = categories.length - 1;
      document.getElementById("all-count").textContent = GEAR.length;

      filtersEl.innerHTML = categories.map(cat => {
        const count = cat === "Vše" ? GEAR.length : GEAR.filter(i => i.category === cat).length;
        return `
          <button class="filter-btn ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">
            ${cat} <span class="pill">${count}</span>
          </button>
        `;
      }).join("");

      filtersEl.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          render();
        });
      });

      searchEl.addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        render();
      });

      render();
    }

    function render() {
      const items = GEAR
        .map((item, idx) => ({ ...item, id: String(idx + 1).padStart(2, "0") }))
        .filter(item => {
          const matchCat = activeCategory === "Vše" || item.category === activeCategory;
          const matchSearch =
            !searchQuery ||
            item.name.toLowerCase().includes(searchQuery) ||
            (item.note && item.note.toLowerCase().includes(searchQuery)) ||
            item.category.toLowerCase().includes(searchQuery);
          return matchCat && matchSearch;
        });

      document.getElementById("shown-count").textContent = items.length;

      if (!items.length) {
        gridEl.innerHTML = `<div class="empty-state">Žádný produkt neodpovídá zadanému hledání nebo filtru.</div>`;
        return;
      }

      gridEl.innerHTML = items.map(item => `
        <article class="card">
          <div>
            <div class="preview-box" aria-hidden="true">${item.icon}</div>
            <div class="card-meta">
              <span class="cat-tag">${item.category}</span>
              <span class="item-num">#${item.id}</span>
            </div>
            <h2 class="card-title">${item.name}</h2>
            ${item.note ? `<p class="card-note">${item.note}</p>` : ""}
          </div>
        </article>
      `).join("");
    }

    init();
  </script>
</body>
</html>
